<style>
/* Layout: одна колонка до 640px, один экран = один шаг (старт → вопрос → результат), как в «Колесе привычек» */
:root{
  --bg:#03080C; --panel:#0A1C27; --panel2:#0B202D; --line:#1B3C4D;
  --fg:#F2F7FA; --muted:#9DB3C1; --teal:#27E0C6; --cyan:#1EC8E8; --navy:#0B2539;
  --warm:#F6C35B;
  --f-body:'Manrope',Arial,sans-serif; --f-emoji:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body),var(--f-emoji);
  background-image:
    radial-gradient(at 0% 0%, rgba(0,99,120,.53) 0, transparent 30%),
    radial-gradient(at 100% 90%, rgba(0,185,176,.45) 0, transparent 30%),
    radial-gradient(at 7% 100%, rgba(6,49,103,.53) 0, transparent 26%);
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
.e{font-family:var(--f-emoji);font-weight:400;font-style:normal}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

/* brand */
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.logo{width:96px;height:96px}
.brand b{font-size:21px;font-weight:800;margin-top:6px}
.brand span{font-size:13px;color:var(--muted)}
.mini{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.mini .t{font-size:13px;color:var(--muted)} .mini .t b{color:var(--teal);font-weight:800;letter-spacing:.04em}
.mini svg{width:44px;height:44px;flex:0 0 auto}

.eyebrow{font-size:14px;font-weight:800;letter-spacing:.12em;text-align:center;margin-top:30px}
.title{font-size:clamp(34px,8vw,48px);line-height:1.04;font-weight:800;text-align:center;margin:10px 0 0;text-wrap:balance;
  background:linear-gradient(90deg,var(--cyan),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(16px,3.6vw,19px);line-height:1.5;color:#C3D2DC;text-align:center;margin:16px auto 0;max-width:34em;text-wrap:balance}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.stat{background:rgba(10,28,39,.7);border:1px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:#C3D2DC}

.box{background:rgba(10,28,39,.72);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:16px}
.box h3{margin:0 0 14px;font-size:14px;font-weight:800;letter-spacing:.06em}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px}
.type .ic{font-size:26px;line-height:1}
img.lk{height:1.15em;width:auto;vertical-align:-0.22em;display:inline-block}
.type b{display:block;font-size:15px}
.type span{font-size:12.5px;color:var(--muted)}

.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:20px;border:0;border-radius:18px;
  background:linear-gradient(90deg,var(--cyan),var(--teal));color:var(--navy);font-weight:800;font-size:18px;letter-spacing:.12em;padding:19px 16px;text-decoration:none;transition:transform .15s, filter .15s}
.cta:hover{filter:brightness(1.08)} .cta:active{transform:scale(.99)}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5}
.src{font-size:12px;color:#6F8796;text-align:center;margin-top:18px;line-height:1.5}

/* question */
.qhead{border-bottom:1px solid var(--line);padding-bottom:18px;margin:0 calc(-1 * max(16px, env(safe-area-inset-left,0px)))}
.qhead > div{padding-inline:max(16px, env(safe-area-inset-left,0px))}
.qhead h1{font-size:clamp(26px,6vw,34px);font-weight:800;margin:0}
.qhead p{margin:8px 0 0;color:#C3D2DC;font-size:15px;line-height:1.5}
.card{background:rgba(5,14,20,.55);border:1px solid #102C3A;border-radius:24px;padding:22px 20px;margin-top:22px}
.prog-row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:#0E2533;border-radius:99px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--teal));border-radius:99px;transition:width .3s}
.q{font-size:clamp(19px,4.6vw,23px);line-height:1.3;font-weight:800;margin:22px 0 18px;text-wrap:balance}
.q .e{margin-right:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:15px 18px;font-size:16px;line-height:1.35;font-weight:600;transition:border-color .15s, background .15s}
.opt:hover{border-color:#2A6A78}
.opt.sel{border-color:var(--teal);background:#0D2E35}
.nav{display:flex;justify-content:space-between;margin-top:18px}
.back{background:none;border:0;color:var(--muted);font-size:15px;font-weight:700;padding:8px 0}
.back[disabled]{visibility:hidden}

/* result */
.res-type{font-size:72px;line-height:1;text-align:center;margin-top:24px}
.score{display:flex;justify-content:center;align-items:baseline;gap:6px;margin-top:14px;font-variant-numeric:tabular-nums}
.score b{font-size:44px;font-weight:800;color:var(--teal)} .score span{color:var(--muted);font-weight:700}
.scale{margin-top:22px}
.scale .track{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,#3B4FB8,#2A7FD0,#27C6B9,#9ED46A,#F6C35B)}
.scale .pin{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--navy);box-shadow:0 0 0 3px var(--teal);transform:translate(-50%,-50%)}
.scale .lbls{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:10px;font-weight:600}
.legend{display:grid;gap:6px;margin-top:16px}
.legend div{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-size:14px;color:var(--muted);border:1px solid transparent;font-variant-numeric:tabular-nums}
.legend div .e{font-size:18px}
.legend div b{font-weight:700;color:var(--muted)}
.legend div.me{background:#0D2E35;border-color:var(--teal);color:var(--fg)}
.legend div.me b{color:var(--teal)}
.legend div.me::after{content:"← ты здесь";grid-column:2/-1;font-size:12px;font-weight:800;color:var(--teal);margin-top:-2px}
.for{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:10px}
.for li{display:flex;gap:10px;font-size:15px;line-height:1.45;color:#E4EEF3}
.for li .e{flex:0 0 22px;font-size:18px;line-height:1.25}
/* карусель */
.car{position:relative;margin-top:4px}
.car-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 0 8px}
.car-track::-webkit-scrollbar{display:none}
.car-slide{flex:0 0 82%;max-width:360px;scroll-snap-align:start;padding:0;border:0;background:none;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:zoom-in}
.car-slide img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;background:#0B202D}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(3,8,12,.75);color:var(--fg);font-size:26px;line-height:1;display:none}
.car-nav.prev{left:-8px}.car-nav.next{right:-8px}
@media (hover:hover) and (pointer:fine){.car-nav{display:block}}
.car-dots{display:flex;justify-content:center;gap:7px;margin-top:6px}
.car-dots i{width:8px;height:8px;border-radius:99px;background:#24485A;cursor:pointer;transition:width .2s,background .2s}
.car-dots i.on{width:22px;background:var(--teal)}
.car-hint{text-align:center;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(1,5,8,.94);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(10,28,39,.85);color:var(--fg);font-size:28px;line-height:1}
.lb-nav.prev{left:max(10px,env(safe-area-inset-left,0px))}.lb-nav.next{right:max(10px,env(safe-area-inset-right,0px))}
.lb-bar{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:22px;font-size:14px;font-weight:700;color:var(--muted)}
.path{list-style:none;padding:0;margin:0;display:grid;gap:0;position:relative}
.path li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;color:#E4EEF3;padding:9px 0;border-bottom:1px dashed rgba(39,224,198,.18)}
.path li:last-child{border-bottom:0}
.path li .e{flex:0 0 24px;font-size:19px;line-height:1.2}
.arrow{text-align:center;font-size:24px;margin:12px 0 6px}
.promise{background:rgba(39,224,198,.1);border:1px solid rgba(39,224,198,.35);border-radius:16px;padding:14px 16px;font-size:16.5px;line-height:1.45;font-weight:800;text-align:center;text-wrap:balance}
.promise span{color:var(--teal)}
.list{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.list li{display:flex;gap:12px;font-size:15px;line-height:1.5}
.list li .e{font-size:19px;line-height:1.3;flex:0 0 22px}
.club{border-color:rgba(39,224,198,.35);background:linear-gradient(160deg,rgba(13,46,53,.85),rgba(10,28,39,.85))}
.club h3{font-size:20px;letter-spacing:0;line-height:1.25}
.club p{font-size:15px;line-height:1.6;color:#D5E2EA;margin:0}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.feat div{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.feat .wide{grid-column:1/-1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ghost{background:transparent;border:2px solid var(--line);border-radius:14px;padding:13px;font-weight:700;font-size:14.5px;color:var(--fg)}
.ghost:hover{border-color:#2A6A78}
.modal{position:fixed;inset:0;z-index:50;background:rgba(1,6,10,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.sheet{position:relative;width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 20px 20px}
.sheet h3{margin:0;font-size:20px;font-weight:800;padding-right:36px}
.sheet p{margin:6px 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
.sheet .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:15px}
.sh-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sh{display:block;text-align:center;text-decoration:none;font-weight:800;font-size:14px;padding:13px 6px;border-radius:12px;color:#fff}
.sh.tg{background:#229ED9}.sh.wa{background:#25A35A}.sh.vk{background:#0077FF}
.sh:hover{filter:brightness(1.1)}
.sheet label{display:block;margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.sheet textarea{width:100%;resize:none;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:500 14px/1.5 var(--f-body),var(--f-emoji)}
@media (max-width:380px){.sh-row{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--teal);color:var(--navy);font-weight:800;padding:12px 18px;border-radius:12px;font-size:14px}

@media (max-width:460px){
  .types,.feat{grid-template-columns:1fr}
  .stat b{font-size:22px}
}
/* ===== АНИМАЦИИ ===== */
/* 1. Логотип рисуется сам */
.logo-anim path{stroke-dasharray:84;stroke-dashoffset:84;animation:draw .9s .35s cubic-bezier(.6,0,.3,1) forwards}
.logo-anim circle{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s 1.15s cubic-bezier(.3,1.7,.5,1) forwards}
.logo-anim rect{transform-box:fill-box;transform-origin:center;animation:logoIn .6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes logoIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 3. Живой фон «день — ночь» */
#sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#sky .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
#sky .g1{width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:radial-gradient(circle,rgba(0,120,150,.7),transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
#sky .g2{width:55vmax;height:55vmax;right:-20vmax;bottom:-25vmax;background:radial-gradient(circle,rgba(0,190,170,.55),transparent 65%);animation:drift2 26s ease-in-out infinite alternate}
#sky .g3{width:40vmax;height:40vmax;left:-10vmax;bottom:-20vmax;background:radial-gradient(circle,rgba(20,60,140,.6),transparent 65%);animation:drift1 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-7vmax,-5vmax) scale(1.08)}}
#sky .stars{position:absolute;inset:0;transition:opacity 1.2s}
body:not(.home) #sky .stars{opacity:.25}
#sky .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.15;animation:twinkle var(--d,4s) ease-in-out var(--dl,0s) infinite}
#sky .star.b{width:3px;height:3px;box-shadow:0 0 6px rgba(160,255,240,.8)}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:var(--o,.8)}}

/* 4. Переходы между вопросами и луна на прогрессе */
.card.enter{animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both}
.card.enter.from-left{animation-name:slideInL}
.card.leave{animation:slideOut .26s ease-in both}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideInL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(-40px)}}
.bar{position:relative;overflow:visible;margin-top:18px}
.bar i{transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar-ic{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:22px;line-height:1;transition:left .45s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px rgba(39,224,198,.5))}
.opt{transition:border-color .15s,background .15s,transform .12s}
.opt:active{transform:scale(.98)}

/* 1. Раскрытие результата */
.res-type.pop{animation:resPop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes resPop{0%{transform:scale(0) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.scale .pin{transition:left 1.4s cubic-bezier(.25,.9,.25,1)}
.legend div.me.reveal{animation:meGlow 1s ease both}
@keyframes meGlow{0%{box-shadow:0 0 0 0 rgba(39,224,198,.6)}60%{box-shadow:0 0 0 10px rgba(39,224,198,0)}100%{box-shadow:none}}

/* 5. Блик на кнопке */
.cta{position:relative;overflow:hidden}
.cta.shine::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine 4.5s ease-in-out 1.5s infinite}
@keyframes shine{0%{left:-60%}22%{left:130%}100%{left:130%}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .logo-anim path{stroke-dashoffset:0}.logo-anim circle{transform:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F3C74"/><stop offset="1" stop-color="#168E8A"/></linearGradient>
    <symbol id="logo" viewBox="0 0 100 100">
      <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#lg)" stroke="#13204A" stroke-width="1.2"/>
      <path d="M21 50 L43 72 L74 34" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="74" cy="34" r="7.5" fill="#5BFFE0" stroke="#13204A" stroke-width="1.6"/>
    </symbol>
  </defs>
</svg>

<div id="sky" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="stars" id="stars"></div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<div class="lightbox" id="lightbox" hidden>
  <img id="lb-img" alt="">
  <button class="lb-nav prev" id="lb-prev" aria-label="Предыдущий слайд">‹</button>
  <button class="lb-nav next" id="lb-next" aria-label="Следующий слайд">›</button>
  <div class="lb-bar"><span id="lb-count"></span><span>✕ закрыть</span></div>
</div>
<div class="modal" id="share-modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <button class="x" id="sh-close" aria-label="Закрыть">✕</button>
    <h3 id="sh-title">Поделиться результатом <span class="e">📤</span></h3>
    <p>Отправь другу, пусть тоже узнает, сова он или жаворонок</p>
    <div class="sh-row">
      <a id="sh-tg" class="sh tg" target="_blank" rel="noopener">Телеграм</a>
      <a id="sh-wa" class="sh wa" target="_blank" rel="noopener">WhatsApp</a>
      <a id="sh-vk" class="sh vk" target="_blank" rel="noopener">ВКонтакте</a>
    </div>

    <h3 style="margin-top:24px">Загляни внутрь клуба <span class="e">👀</span></h3>
    <div class="car">
      <div class="car-track" id="car-track">
        ${SLIDES.map((s,n)=>`<button class="car-slide" data-n="${n}" aria-label="Открыть: ${s.alt}"><img src="img/${s.f}" alt="${s.alt}" width="1080" height="1350" ${n>1?'loading="lazy"':''}></button>`).join('')}
      </div>
      <button class="car-nav prev" id="car-prev" aria-label="Назад">‹</button>
      <button class="car-nav next" id="car-next" aria-label="Вперёд">›</button>
    </div>
    <div class="car-dots" id="car-dots">${SLIDES.map((s,n)=>`<i class="${n?'':'on'}"></i>`).join('')}</div>
    <p class="car-hint">Листай вбок, нажми, чтобы увеличить</p>
    <h3 style="margin-top:22px">Хватит ждать подходящего момента <span class="e">⏰</span></h3>
    <ol class="path">
      <li><span class="e">1️⃣</span><span>Заходи в Челленджологию</span></li>
      <li><span class="e">2️⃣</span><span>Определи свою цель</span></li>
      <li><span class="e">3️⃣</span><span>Выбирай челлендж</span></li>
      <li><span class="e">4️⃣</span><span>Начинай системно менять себя вместе с людьми, которые тоже хотят стать лучше</span></li>
      <li><span class="e">5️⃣</span><span>Получай бонусы и призы за регулярность и саморазвитие</span></li>
    </ol>
    ${JOIN_URL ? `<a class="cta shine" href="${JOIN_URL}" target="_blank" rel="noopener">ХОЧУ В КЛУБ <span class="e" style="letter-spacing:0">🚀</span></a>`
               : `<button class="cta shine" id="join">ХОЧУ В КЛУБ <span class="e" style="letter-spacing:0">🚀</span></button>`}
    <p class="note">Откроется Телеграм-бот: там подробно о клубе, стоимость и оплата</p>
  </div>

  <div class="row2">
    <button class="ghost" id="share"><span class="e">📤</span> Поделиться результатом</button>
    <button class="ghost" id="again"><span class="e">🔁</span> Пройти заново</button>
  </div>
  <p class="src">Опросник Хорна-Остберга (Morningness-Eveningness Questionnaire), 1976. Тест не является медицинской диагностикой.</p>`;
  document.getElementById('again').onclick = () => { ans = new Array(Q.length).fill(null); start(); };
  initCarousel();
  revealResult(score, pos);
  const j = document.getElementById('join'); if (j) j.onclick = () => toast('Ссылка на вступление скоро появится 🙌');
  document.getElementById('share').onclick = () => {
    const url = 'https://challengology.github.io/chronotype-test/';
    const txt = `Я прошёл(ла) тест на хронотип от Челленджологии: ${t.name} ${t.ic} (${score} из 86). А ты сова или жаворонок? Пройди за 3 минуты 👇`;
    // На телефоне — родное меню «Поделиться». На компьютере — окно с кнопками мессенджеров и копированием
    const isPhone = matchMedia('(pointer:coarse)').matches;
    if (isPhone && navigator.share) navigator.share({ title:'Сова или жаворонок?', text:txt, url }).catch(e => { if (e && e.name !== 'AbortError') openShare(txt, url); });
    else openShare(txt, url);
  };
  scrollTo(0,0);
}

/* Раскрытие результата: баллы считаются, отметка едет по шкале, тип подсвечивается */
function revealResult(score, pos){
  if (RM) return;
  const num = document.getElementById('score-num'), pin = document.getElementById('pin');
  const t0 = performance.now() + 750, dur = 1400;
  const tick = now => {
    const k = Math.min(1, Math.max(0, (now - t0) / dur));
    num.textContent = Math.round(score * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  setTimeout(() => { pin.style.left = pos + '%'; }, 750);
  setTimeout(() => { const me = document.querySelector('.legend .me'); if (me) me.classList.add('reveal'); }, 2150);
}

/* ===== КАРУСЕЛЬ «Загляни внутрь клуба» =====
   Картинки лежат в папке img. Чтобы поменять порядок или добавить слайд — правь этот список. */
const SLIDES = [
  {f:"slide-sleep.jpg",  alt:"Сфера «Сон»"},
  {f:"slide-food.jpg",   alt:"Сфера «Питание»"},
  {f:"slide-sport.jpg",  alt:"Сфера «Физическая активность»"},
  {f:"slide-55.jpg",     alt:"55 челленджей"},
  {f:"slide-game.jpg",   alt:"Игровой формат: уровни и очки опыта"},
  {f:"slide-prizes.jpg", alt:"Бонусы и призы"},
  {f:"slide-team.jpg",   alt:"Сильное окружение"},
];
function initCarousel(){
  const track = document.getElementById('car-track'); if (!track) return;
  const dots = [...document.querySelectorAll('#car-dots i')];
  const slides = [...track.children];
  const cur = () => Math.round(track.scrollLeft / slides[0].offsetWidth);
  const go = n => { n = Math.max(0, Math.min(slides.length-1, n)); track.scrollTo({left: slides[n].offsetLeft - slides[0].offsetLeft, behavior:'smooth'}); };
  track.addEventListener('scroll', () => { const c = cur(); dots.forEach((d,k)=>d.classList.toggle('on', k===c)); }, {passive:true});
  document.getElementById('car-prev').onclick = () => go(cur()-1);
  document.getElementById('car-next').onclick = () => go(cur()+1);
  dots.forEach((d,k)=> d.onclick = () => go(k));
  slides.forEach(s => s.onclick = () => openLightbox(+s.dataset.n));
}
let lbN = 0;
function openLightbox(n){
  lbN = n; const lb = document.getElementById('lightbox');
  document.getElementById('lb-img').src = 'img/' + SLIDES[n].f;
  document.getElementById('lb-img').alt = SLIDES[n].alt;
  document.getElementById('lb-count').textContent = `${n+1} / ${SLIDES.length}`;
  lb.hidden = false;
}
function lbStep(d){ openLightbox((lbN + d + SLIDES.length) % SLIDES.length); }
(() => {
  const lb = document.getElementById('lightbox');
  lb.addEventListener('click', e => {
    if (e.target.closest('#lb-prev')) return lbStep(-1);
    if (e.target.closest('#lb-next')) return lbStep(1);
    lb.hidden = true;
  });
  let x0 = null;
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', e => { if (x0===null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50){ lbStep(dx<0?1:-1); } x0 = null; });
  document.addEventListener('keydown', e => { if (lb.hidden) return; if (e.key==='ArrowRight') lbStep(1); if (e.key==='ArrowLeft') lbStep(-1); if (e.key==='Escape') lb.hidden = true; });
})();

/* Окно «Поделиться результатом» */
function openShare(txt, url){
  const full = `${txt}\n${url}`;
  const m = document.getElementById('share-modal');
  const ta = document.getElementById('share-text');
  ta.value = full;
  const enc = encodeURIComponent;
  document.getElementById('sh-tg').href = `https://t.me/share/url?url=${enc(url)}&text=${enc(txt)}`;
  document.getElementById('sh-wa').href = `https://wa.me/?text=${enc(full)}`;
  document.getElementById('sh-vk').href = `https://vk.com/share.php?url=${enc(url)}&title=${enc(txt)}`;
  const btn = document.getElementById('sh-copy');
  btn.textContent = 'Скопировать текст и ссылку';
  btn.onclick = () => {
    const done = () => { btn.textContent = 'Скопировано ✓'; };
    const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); done(); } catch(e) { btn.textContent = 'Выдели текст выше и нажми Ctrl+C'; } };
    if (navigator.clipboard) navigator.clipboard.writeText(full).then(done).catch(fallback); else fallback();
  };
  m.hidden = false;
  ta.scrollTop = 0;
}
function closeShare(){ document.getElementById('share-modal').hidden = true; }
document.getElementById('share-modal').addEventListener('click', e => { if (e.target.id === 'share-modal' || e.target.closest('#sh-close')) closeShare(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeShare(); });

let tt;
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2600); }

start();
</script>
